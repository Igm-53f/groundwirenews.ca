# Example static vhost for https://groundwirenews.ca — generated by wp-to-static 4.1.5.
# 1. include /home/groundwirenews.ca/static-pilot-1/wp-to-static-nginx-410-map.conf inside http{}
# 2. keep your existing listen/ssl lines; replace root/location blocks with these.
server {
    listen 80;
    listen 443 ssl http2;
    server_name groundwirenews.ca www.groundwirenews.ca;

    root /home/groundwirenews.ca/static-pilot-1;
    index index.html;
    charset utf-8;

    if ($wp_static_gone) { return 410; }
    include "/home/groundwirenews.ca/static-pilot-1/wp-to-static-nginx-redirects.conf";

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~* \.(css|js|mjs|json|map|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
